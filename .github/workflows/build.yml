name: build-release

# 每次 push 触发构建；推到 main 额外创建 GitHub Release（版本号自动递增，
# 更新内容由 GitHub 按两次版本之间的提交自动生成）。详见 docs/06-ci-release.md
# 纯文档改动（docs/ 与 *.md）不触发，节省 Actions 时长。

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pc:
    name: 构建 PC 端（自包含单文件 exe）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish src/BTUnlock.Desktop -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          "-p:Version=0.1.${{ github.run_number }}"
          -o publish/pc

      - name: 打包并生成校验和
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          $zip = "BTUnlock-Desktop-win-x64-v$v.zip"
          Compress-Archive -Path publish/pc/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -NoNewline -Encoding ascii "$zip.sha256"
          Get-ChildItem BTUnlock-Desktop-* | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BTUnlock-Desktop-win-x64
          path: |
            BTUnlock-Desktop-win-x64-*.zip
            BTUnlock-Desktop-win-x64-*.zip.sha256
          if-no-files-found: error

  build-android:
    name: 构建安卓端（APK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 安装 android workload
        run: dotnet workload install android

      - name: 构建 APK
        run: >
          dotnet build src/BTUnlock.Android -c Release
          "-p:Version=0.1.${{ github.run_number }}"
          "-p:ApplicationDisplayVersion=0.1.${{ github.run_number }}"
          "-p:ApplicationVersion=${{ github.run_number }}"

      - name: 打包并生成校验和
        run: |
          v="0.1.$GITHUB_RUN_NUMBER"
          apk=$(ls src/BTUnlock.Android/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then echo "未找到已签名 APK"; exit 1; fi
          cp "$apk" "BTUnlock-Android-v$v.apk"
          sha256sum "BTUnlock-Android-v$v.apk" > "BTUnlock-Android-v$v.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BTUnlock-Android
          path: |
            BTUnlock-Android-*.apk
            BTUnlock-Android-*.apk.sha256
          if-no-files-found: error

  build-cp:
    name: 构建解锁凭据提供程序（C++ x64）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 编译（静态 CRT，LogonUI 环境零依赖）
        shell: cmd
        run: |
          mkdir obj
          cl /nologo /std:c++17 /EHsc /MT /O2 /DUNICODE /D_UNICODE /W3 /LD ^
            src\BTUnlock.CredentialProvider\dllmain.cpp ^
            src\BTUnlock.CredentialProvider\Provider.cpp ^
            src\BTUnlock.CredentialProvider\Credential.cpp ^
            src\BTUnlock.CredentialProvider\PresenceChannel.cpp ^
            src\BTUnlock.CredentialProvider\Log.cpp ^
            /Fe:BTUnlock.CredentialProvider.dll /Fo:obj\ ^
            /link /DEF:src\BTUnlock.CredentialProvider\exports.def ole32.lib advapi32.lib secur32.lib

      - name: 打包（DLL + 安装/卸载脚本 + 说明）
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          $dir = "cp-pkg"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item BTUnlock.CredentialProvider.dll $dir
          Copy-Item tools/install-cp.ps1 $dir
          Copy-Item tools/uninstall-cp.ps1 $dir
          @'
          BTUnlock 人来解锁组件（实验性）
          ==================================
          安装：右键 install-cp.ps1 →「使用 PowerShell 运行」（需管理员）
          卸载：以管理员运行 uninstall-cp.ps1
          前置：PC 端主程序已运行、已绑定手机、已在主界面录入 Windows 密码并勾选启用。
          紧急停用（不卸载）：管理员运行
            reg add HKLM\SOFTWARE\BTUnlock /v UnlockProviderEnabled /t REG_DWORD /d 0 /f
          日志：C:\ProgramData\BTUnlock\cp.log
          详见仓库 docs/04-unlock-credential-provider.md（安全须知必读）。
          '@ | Out-File "$dir/README.txt" -Encoding utf8
          Compress-Archive -Path "$dir/*" -DestinationPath "BTUnlock-UnlockProvider-win-x64-v$v.zip"
          Get-FileHash "BTUnlock-UnlockProvider-win-x64-v$v.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  BTUnlock-UnlockProvider-win-x64-v$v.zip" } |
            Set-Content -NoNewline "BTUnlock-UnlockProvider-win-x64-v$v.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BTUnlock-UnlockProvider-win-x64
          path: |
            BTUnlock-UnlockProvider-win-x64-*.zip
            BTUnlock-UnlockProvider-win-x64-*.zip.sha256
          if-no-files-found: error

  release:
    name: 发布 Release（仅 main 分支）
    needs: [build-pc, build-android, build-cp]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="0.1.$GITHUB_RUN_NUMBER"
          tag="v$v"
          # 同一 run 重跑时清理旧 Release/Tag，保证可重复执行
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --title "v$v" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            dist/*
